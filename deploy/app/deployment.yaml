apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartapi-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cartapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartapi
    spec:
      containers:
        - image: chas3air/cartapi:demo-v1
          name: cartapi
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
