apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.pvName }}
  namespace: {{ .Values.namespace }}
  labels:
    type: local
spec:
  storageClassName: {{ .Values.storage.className }}
  capacity:
    storage: {{ .Values.storage.size }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "{{ .Values.storage.hostPath }}"
